# A corruption recipe that runs on the core install: no UMLS, no extras.
#
#   robustehr run --corpus examples/demo_notes.csv --config examples/recipe.yaml --out demorecipe/
#
# The schema is in robustehr.config; the README's "Recipes" section explains
# each key.
seed: rep0
documents: {fraction: "0.50"}
corruptions: [input.typo, input.ocr_confusion]
corruptions_per_document: {min: 1, max: 2}
severity: medium
params:
  input.ocr_confusion: {max_edits_per_token: 1}
target:
  mode: clinical
