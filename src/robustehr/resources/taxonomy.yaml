- id: semantic.experiencer_shift
  version: 1.0.0+r70ac9237
  level: assertion
  channel: semantic
  contract: reference_altering_by_design
  dose_kind: rate
  denominator: experiencer cues, on this package's sentence boundaries, excluding scope terminators
  sub_unit_policy: ceil
  targets:
  - assertion_cue
  resources:
  - assertion_flips.yaml
  simulates: a relative's condition read as the patient's. Detector has no published gold
    and kappa 0.22 against an independent reading — it marked 8 spans family where 1 was warranted,
    so this operator was cut from v1 and reinstated by explicit decision. Read its dose beside
    that number
- id: semantic.experiencer_shift_llm
