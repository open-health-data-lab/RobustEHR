# RobustEHR operator taxonomy — GENERATED, DO NOT EDIT BY HAND.
#
# Regenerate with:  robustehr taxonomy --yaml > src/robustehr/resources/taxonomy.yaml
#
# The Python operator declarations are the source of truth; this file is
# committed like a lockfile so the taxonomy stays reviewable and diffable
# without opening the source, and a test asserts the two agree.
#
# Column meanings:
#   level        the operator's eligible unit — which *is* its dose denominator
#   channel      the failure mode it simulates
#   contract     the reference promise, and how that promise is discharged
#   canonicalizer  the projection proving an INVARIANT contract, checked in CI
#   targets      protection classes the operator is permitted to edit
#   resources    hashed lexicons folded into the operator's version
#   external_resources  locally-built, unshippable inputs. Named, not hashed:
#                their digest is a property of the machine that built them, so
#                the committed version carries `external` in their place

schema_version: '1.1'
operators:
- id: control.char_shuffle
  version: 1.0.0
  level: word
  channel: control
  contract: control_destructive
  dose_kind: rate
  denominator: alphabetic tokens of at least four characters
  sub_unit_policy: ceil
  targets:
  - ambiguous_mention
  - assertion_cue
  - clinical_mention
  - decimal_point
  - deid_placeholder
  - divider_rule
  - dosage
  - lab_block
  - list_marker
  - numeric_value
  - phenotype_evidence
  - section_header
  resources: []
  simulates: nothing; it is the positive control
- id: control.identity
  version: 1.0.0
  level: document
  channel: control
  contract: control_null
  dose_kind: rate
  denominator: the document
  sub_unit_policy: ceil
  targets: []
  resources: []
  simulates: nothing; it is the null control
  canonicalizer: identity
- id: discourse.section_duplicate
  version: 1.0.0
  level: section
  channel: discourse
  contract: conditionally_preserving
  dose_kind: count_per_doc
  denominator: complete identified sections, header and body
  sub_unit_policy: ceil
  targets:
  - lab_block
  - list_marker
  - numeric_value
  - section_header
  resources: []
  simulates: copy-paste note bloat that repeats a section verbatim
- id: discourse.sentence_delete
  version: 1.0.0
  level: sentence
  channel: discourse
  contract: reference_altering_by_design
  dose_kind: rate
  denominator: prose sentences, excluding lab blocks, list items and headers
  sub_unit_policy: ceil
  targets:
  - ambiguous_mention
  - assertion_cue
  - clinical_mention
  - decimal_point
  - deid_placeholder
  - divider_rule
  - dosage
  - lab_block
  - list_marker
  - numeric_value
  - phenotype_evidence
  - section_header
  resources: []
  simulates: summarization loss and terse documentation
- id: discourse.truncate
  version: 1.0.0
  level: document
  channel: discourse
  contract: reference_altering_by_design
  dose_kind: rate
  denominator: document characters; severity is the fraction removed
  sub_unit_policy: ceil
  targets:
  - ambiguous_mention
  - assertion_cue
  - clinical_mention
  - decimal_point
  - deid_placeholder
  - divider_rule
  - dosage
  - lab_block
  - list_marker
  - numeric_value
  - phenotype_evidence
  - section_header
  resources: []
  simulates: context-window limits and EHR free-text field caps
  modes:
