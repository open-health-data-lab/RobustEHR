vetted_by: llm-proposed, terminology-grounded, not clinician-reviewed
what: clinical terms proposed by a model and GROUNDED against the local UMLS release. The
  model supplied strings; every identifier here came from UMLS. A grounded term is by definition
  a UMLS string and is stored as surface_sha256, not in the clear. Terms that failed to ground
  are NOT in UMLS and are listed readable — they are the method's error bar and a reader needs
  to see them.
why: UMLS has no disease->symptom, disease->procedure or disease->analyte relation to traverse,
  so the relation-first expansion in concepts/facets.py returns zero for those facets on every
  phenotype. Knowledge names them; the terminology grounds them.
