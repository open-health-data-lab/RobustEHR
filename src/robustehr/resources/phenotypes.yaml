# Phenotype definitions: seed concepts, expanded at build time.
#
# A phenotype is declared by naming a handful of seed concepts, not by
# enumerating every way a note can express it. Expansion through
# `SNOMEDCT_US isa` union `MTH RN` supplies the rest — see
# robustehr/concepts/hierarchy.py for why both edge sets are needed.
#
# Only IDENTIFIERS appear here. No UMLS strings, ever: this file ships with the
# package, and the Metathesaurus licence does not permit redistributing
# vocabulary content. `label` is our own wording, not a UMLS preferred term.
#
# `measured_set_recall` is the fraction of expert-annotated evidence for this
# phenotype that the matcher recovers with a concept inside the set, on the
# SNOMED CT Entity Linking Challenge test split (68 notes, 23,131 spans). It
# travels with the definition on purpose: every protect-mode result is
# conditional on it, because evidence the matcher never found is evidence that
# was never protected, and the run still reports evidence_touch = 0.
#
# `measured_set_precision` is its counterpart, and it is not optional. Recall
# rises monotonically with closure size, so a set that swallows half the
# terminology posts excellent recall — pulmonary_embolism at the file-wide depth
# expands to 9,712 concepts and scores 0.669 recall while meaning nothing.
# Precision is scored against the seed's SNOMEDCT_US `isa` closure, which is
# INDEPENDENT of the `MTH RN` edges under test; scoring a set against itself
# forgave that blow-up at 0.823. Read the two together, never one alone.
#
# A null recall means NOT MEASURABLE HERE, not zero: the corpus carries too few
# annotated spans for that phenotype. A measured 0.0 is a different and much
# worse fact, and both appear below. Reproduce with validation/phenotype/scripts/phenotype_eval.py
# --limit 300 --overlap length --trim-affixes --prefer-snomed.
#
# `measured_set_recall`/`measured_set_precision` score the DISORDER FACET
# alone — the seed closure this file declares — and the closure layers did not
# touch that facet, so they are stable. `measured_union_recall` and
# `union_gold_spans` score what a `pheno=X` target ACTUALLY selects at
# runtime: the disorder closure plus the medication facet (vetting-gated,
# with RxNorm identity variants), the vetted LLM-proposed facet, declared
# findings, and the vetted evidence closure — see
# validation/methodology/17-phenotype-association-method.md §3-§4. Those numbers are
# re-measured whenever the vetting or closure artifacts change (last:
# 2026-08-18, against the 18,074-CUI union), and the denominator moves with
# the set: widening a set makes MORE gold spans count as its evidence, so
# union recall is comparable only within one measurement date. Union
# PRECISION is null by construction (no independent key exists for the
# union; validation/methodology/14 §5).
#
# `cohorts` names the study a definition serves. See
# validation/phenotype/PIPELINE.md for how to add one.

schema_version: "1.1"
source: SNOMEDCT_US
max_depth: 6

