  - head
  - middle
- id: input.ocr_confusion
  version: 2.1.0+r4964b8cf
  level: char
  channel: input
  contract: conditionally_preserving
  dose_kind: rate
  denominator: confusable character positions inside tokens of at least two characters; in
    ligature mode, occurrences of a confusable character run; at most `max_edits_per_token`
    positions per token when that parameter is set
  sub_unit_policy: ceil
  targets:
  - dosage
  - lab_block
  - numeric_value
  resources:
  - ocr_confusions.yaml
  simulates: optical character recognition on a scanned or faxed chart
  modes:
  - glyph
  - ligature
- id: input.phonetic_confusion
  version: 1.0.0+r5ddf5df3
  level: token
  channel: input
  contract: reference_altering_by_design
  dose_kind: rate
  denominator: tokens for which a morpheme rule generates a phonetically confusable substitute
  sub_unit_policy: ceil
  targets:
  - dosage
  - lab_block
  - numeric_value
  - section_header
  resources:
  - phonetic_rules.yaml
  simulates: speech-recognition and dictation substitution errors
- id: input.typo
  version: 1.0.0
  level: word
  channel: input
  contract: conditionally_preserving
  dose_kind: rate
  denominator: alphabetic tokens of at least three characters; alphanumeric tokens of the
    same length too when `include_mixed` is set
  sub_unit_policy: ceil
  targets: []
  resources: []
  simulates: keyboard typing errors
  modes:
  - substitute
  - transpose
  - delete
  - double
- id: lexical.medication_rename
  version: 1.0.0+rexternal
  level: mention
  channel: lexical
  contract: conditionally_preserving
  dose_kind: rate
  denominator: medication name tokens resolving to a confident generic-brand equivalence
  sub_unit_policy: ceil
  targets:
  - clinical_mention
  resources:
  - drug_synonyms.json
  simulates: a clinician or institution that names drugs the other way round
  external_resources:
  - drug_synonyms.json
  modes:
  - flip
  - to_brand
  - to_generic
- id: lexical.numeral_to_word
  version: 1.0.0
  level: number
  channel: lexical
  contract: conditionally_preserving
  dose_kind: rate
  denominator: integer tokens with an exact written form — no decimal point, no leading zero,
    at most six digits — carrying no unit in `bare` mode, any in `all` mode
  sub_unit_policy: ceil
  targets:
  - dosage
  - numeric_value
  resources: []
  simulates: a dictated or template-written note that spells numbers out
  modes:
  - bare
  - all
- id: render.break_removal
