  sub_unit_policy: ceil
  targets:
  - assertion_cue
  resources:
  - assertion_flips.yaml
  - assertion_flip_prompt.yaml
  simulates: a relative's finding read as the patient's, flipped by rewriting the clause.
    Sentence rewritten by a configured LLM rather than by cue substitution, with a minimal-diff
    edit, a protection check and a deterministic fallback. Reproducible by replay always,
    and by regeneration given the response cache; the model id must be reported beside the
    operator version.
