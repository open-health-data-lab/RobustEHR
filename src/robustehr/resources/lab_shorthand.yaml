# Clinical shorthand → long form, scoped to the structural slot it appears in.
#
# ── WHAT THIS IS ────────────────────────────────────────────────────────────
# Stage 3a/3b of the concept-matching pipeline. A short form here is expanded to
# its long form, and the LONG FORM is what gets looked up in the terminology.
# Each long form is ordinary clinical English, chosen to be a string the
# terminology carries so the lookup succeeds, and each row carries a SNOMED
# identifier. Plain English and identifiers ship; no Metathesaurus string is
# transcribed here, and the user's own licensed UMLS resolves the rest.
#
# ── WHY IT EXISTS ───────────────────────────────────────────────────────────
# Measured on the SNOMED CT Entity Linking Challenge: 44.9% of abbreviation-
# shaped gold spans have no UMLS candidate carrying the right category, and half
# of those sit in a structural slot. `creatinine` is in UMLS; `creat` is not.
# `anion gap` is in UMLS; `angap` is not. No amount of disambiguation reaches
# them, because the candidate set is empty. Only vocabulary does.
#
# ── PROVENANCE, AND WHY IT MATTERS ──────────────────────────────────────────
# **Authored from general clinical knowledge — by panel, not by corpus.** The
# entries below were written by walking the standard orderable panels (CBC with
# differential, BMP/CMP, LFTs, coagulation, cardiac markers, ABG, urinalysis)
# and the standard physical-examination systems. They are not transcribed from a
# frequency ranking of any corpus.
#
# The distinction is not pedantry. This project's notes are MIMIC-IV under the
# PhysioNet Credentialed Health Data Use Agreement, and **the DUA binds the
# surfaces, not just the note text** — a ranked list of the most frequent
# abbreviations in MIMIC is a MIMIC derivative and could not ship. A list of
# what a CBC contains is knowledge any clinician has. The corpus is used only
# afterwards, to report what fraction of this table it exercises, which is a
# measurement of coverage rather than a source of content.
#
# ── SLOT SCOPING IS THE SAFETY MECHANISM ────────────────────────────────────
# Every entry names the structural slot it is valid in, and is applied nowhere
# else. This is what makes context-free expansion safe, and it lets in entries a
# global table would have to reject:
#
#   `pt`  in a value slot is prothrombin time. In prose it is the patient, or
#         physical therapy, and expanding it there would be wrong most of the time.
#   `ca`  in a value slot is calcium. In prose it is cancer.
#   `ph`  in a value slot is the acidity. In prose it is past history.
#
# So the entry criterion is **monosemous within its slot**, not monosemous
# outright. Anything ambiguous even inside its slot does not belong here — it
# belongs to the anchor-vote rung, which abstains.
#
#   value_label — the label half of `Creat-1.1`, i.e. a labelled numeric value
#                 inside a self-labelling aligned block
#   exam_label  — the system named by an exam subsection header, `HEENT:`
#
# ── EVERY LONG FORM MUST BE ONE THE TERMINOLOGY CARRIES ─────────────────────
# The long form is a lookup key, so an entry expanding to a string UMLS does not
# hold is dead weight: it resolves to nothing and the mention is dropped exactly
# as if the row were absent. `crp -> C reactive protein` fails where
# `c-reactive protein` works, and `heent -> head eyes ears nose and throat`
# fails where `head and neck` works.
#
# So the correct long form is not necessarily the *expansion*; it is the nearest
# term the vocabulary actually contains. Each row therefore carries a `snomed:`
# identifier as the authoritative half, with the long form kept as the reviewer's
# handle and a fallback.
#
# `validation/pipeline/scripts/check_expansions.py` reports any row that resolves to nothing.
# Two rows were deleted rather than repaired because this release carries no
# resolvable equivalent: `ptt` and `rr`.
#
# ── WHAT BELONGS HERE, AND WHAT DOES NOT ────────────────────────────────────
# Only shorthand **no terminology carries**. That is a narrower remit than it
# first appeared: SNOMED records its own abbreviations through the
# `ABBREV - full term` synonym convention, so `hfref`, `copd` and `nstemi` are
# all derivable — see validation/pipeline/scripts/build_abbrev_inventory.py, which extracts 4,015 of
# them — and are excluded here. A failed exact match is not evidence that a
# term is absent from the vocabulary.
#
# What survives as genuinely hand-authored is institutional laboratory shorthand
# — `creat`, `angap`, `urean`, `rdwsd` — which appears in no vocabulary at all
# and is exactly what the stage-3 gate found unreachable.
#
# ── WHAT IS DELIBERATELY ABSENT ─────────────────────────────────────────────
# A form that already *is* its long form — `lipase`, `ferritin`, `skin`, `neck`
# — is not an abbreviation and gets no row; the loader's consistency check
# refuses any entry expanding to itself, because the point of a row is to reach
# a form the terminology carries, and these already are one. They resolve
# without help.
#
# ── STATUS ──────────────────────────────────────────────────────────────────
# `reviewed: true` — a clinician has read every row. The package reports the flag
# next to any result this table contributed to, because an unreviewed table is an
# assumption wearing the costume of a resource, and the distinction should be
# visible in the artifact rather than remembered.

schema_version: "1.0"
reviewed: true
review_note: >
  Authored from panel structure and standard exam systems, then reviewed row by
  row by a clinician. Each row is checkable without reading any code; where it
  is not, the row is wrong. Re-review is owed whenever a row is added or its
  long form changes, because the identifier is what resolves and the string is
  what makes the row reviewable.

