# Abbreviations whose trailing period is not a sentence boundary.
#
# Sentence boundaries define the denominator of every sentence-level operator,
# so this list is versioned and its content hash goes into every dose record.
# Entries are matched case-insensitively against the word immediately before a
# period, with the period excluded.
schema_version: "1.0"

# A single capital letter before a period is almost always a genus abbreviation
# or an initial in this domain: "E. coli", "C. difficile", "S. aureus",
# "Dr. J. Smith". Treating it as a boundary splits an organism name in half.
single_letter_is_abbreviation: true

abbreviations:
  # --- titles and names ---------------------------------------------------
  - dr
  - drs
  - mr
  - mrs
  - ms
  - prof
  - sr
  - jr
  - st
  - rev

  # --- general prose ------------------------------------------------------
