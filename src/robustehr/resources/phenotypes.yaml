  - name: hfpef
    label: Heart failure with preserved ejection fraction
    seeds: ["446221000"]
    medication_seeds: ["C3490348", "C2353951", "C4045511"]
    finding_seeds: ["267036007", "62744007", "55442000", "82014009"]
    cohorts: [mipa]
    measured_set_recall: 0.0
    measured_set_precision: null
    gold_evidence_spans: 7
    measured_union_recall: 0.724
    union_gold_spans: 398
    note: >-
      The DISORDER FACET alone is measured zero and remains so: span recall
      0.714 — the text is found for 5 of 7 gold spans — but none carries a
      concept inside the 8-concept closure, so disorder set recall is 0.0.
      This was a DO-NOT-USE phenotype until the evidence closure (2026-08-17):
      the decisive surfaces ("diastolic heart failure", "Diastolic CHF") are
      SIBLINGS of this seed, matched by the matcher to CUIs the closure alone
      could never hold. The vetted closure facet plus medication identity
      variants now carry the runtime set to ~1,150 concepts with union recall
      0.724, and the causal probe measured that this recovered evidence is
      what the phenotyping model's hfpef call actually rides on
      (validation/methodology/14 §7). USABLE for targeting since the closure; the
      disorder-facet zero stays recorded because protect-mode claims scoped
      to the disorder facet are still unsupported.

  - name: hfref
    label: Heart failure with reduced ejection fraction
    seeds: ["703272007"]
    medication_seeds: ["C3490348", "C2353951", "C4033447", "C0037982"]
    finding_seeds: ["267036007", "62744007", "55442000", "82014009"]
    cohorts: [mipa]
    measured_set_recall: 0.0
    measured_set_precision: null
    gold_evidence_spans: 4
    measured_union_recall: 0.813
    union_gold_spans: 359
    note: >-
      The DISORDER FACET alone measures span recall 0.0 — the abbreviation
      "HFrEF" is never matched at all, the failure `heart_failure`'s own note
      names — and that remains true. Like hfpef, this was DO-NOT-USE until the
      evidence closure (2026-08-17): the vetted closure ("Heart Failure,
      Systolic" and variants) plus medication identity variants carry the
      runtime set to ~1,350 concepts with union recall 0.813. USABLE for
      targeting since the closure — with the measured caveat that the causal
      probe found hfref's PREDICTION rides chiefly on the numeric EF channel
      no concept set can reach (validation/methodology/17 §6), so corruption
      targeted at this set is expected to move little.

