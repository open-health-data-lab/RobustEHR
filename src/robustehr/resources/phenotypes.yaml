  - name: pulmonary_embolism
    label: Pulmonary embolism
    seeds: ["59282003"]
    finding_seeds: ["267036007", "2237002", "66857006"]
    cohorts: [mipa]
    max_depth: 1
    measured_set_recall: 0.36
    measured_set_precision: 0.773
    gold_evidence_spans: 50
    measured_union_recall: 0.656
    union_gold_spans: 812
    note: >-
      The one phenotype in this file that needs its own depth bound, and the
      reason `max_depth` exists. At the file-wide depth of 6 this seed reaches
      Vascular diseases (C0042373) through a single MTH RN hop and expands to
      9,712 concepts — recall 0.669, precision 0.049. Depth 2 already collapses
      to precision 0.073, so the bad edge is one hop out. Bounded to depth 1 it
      is 30 concepts at precision 0.773, and the recall cost (0.67 -> 0.36) is
      the price of a set that means what its name says.

