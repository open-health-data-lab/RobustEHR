  # -- MIPA panel ------------------------------------------------------------
  # Declared for the MIPA study. Every number below was measured with the seed
  # beside it, on the split named at the top of this file, before the
  # definition was written. Several are poor and say so: a phenotype that
  # cannot find its own evidence is worse than an absent one, because a run
  # still reports evidence_touch = 0 and that reads like a clean result.

  - name: depression
    label: Depression
    seeds: ["35489007"]
    finding_seeds: ["366979004", "28669007", "225457007"]
    cohorts: [mipa]
    measured_set_recall: 0.111
    measured_set_precision: 0.188
    gold_evidence_spans: 27
    measured_union_recall: 0.653
    union_gold_spans: 124
    note: >-
      The worst measured set in the file, and weak in BOTH directions, which
      rules out the usual explanations. Span recall is 1.0 — the text is found
      every time — so this is entirely concept assignment: annotators mark
      depressive language with concepts outside the Depressive disorder
      closure. Seeding Major depressive disorder (370143000) instead scores
      0.0, and adding it changes nothing, so the seed is not the problem. Do
      not use in protect mode. Treat any depression result as unsupported until
      the assignment failure is characterised.

  - name: type_2_diabetes
    label: Type 2 diabetes mellitus
    seeds: ["44054006"]
    medication_seeds: ["C3490348", "C2353951", "C3885068", "C5139934"]
    finding_seeds: ["28442001", "17173007"]
    cohorts: [mipa]
    measured_set_recall: 0.222
    measured_set_precision: 0.667
    gold_evidence_spans: 54
    measured_union_recall: 0.516
    union_gold_spans: 219
    note: >-
      Low recall with a known and structural cause: notes write "diabetes",
      annotators resolve it to Type 2, and the matcher returns a generic
      diabetes concept that is NOT in the type-2 closure. Precision is fine, so
      what it does claim is right. Adding the generic seed (73211009) lifts
      recall to 0.397 but yields exactly the 382-concept `diabetes_mellitus`
      set — it stops being type 2. Use `diabetes_mellitus` when the study
      question tolerates either type; use this only when it does not.

  - name: type_1_diabetes
    label: Type 1 diabetes mellitus
